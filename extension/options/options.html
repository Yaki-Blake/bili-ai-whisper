<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Bili 本地字幕 · 设置</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px 64px;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1f2328;
      background: #f6f7f9;
    }
    .wrap { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6a737d; font-size: 13px; margin-bottom: 24px; }
    .card {
      background: #fff;
      border: 1px solid #e3e6ea;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 14px; margin: 0 0 14px; font-weight: 500;
      padding-bottom: 10px; border-bottom: 1px solid #eef0f2;
    }
    .field { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field > label { flex: 0 0 126px; color: #40474f; font-size: 13px; }
    .field > input[type="text"],
    .field > input[type="number"],
    .field > select {
      flex: 1; padding: 7px 10px; border: 1px solid #d6dae0; border-radius: 7px;
      font-size: 13px; font-family: inherit; background: #fff; color: #1f2328;
    }
    .field > input:focus, .field > select:focus { outline: 2px solid #cfe3f8; border-color: #378add; }
    .hint { font-size: 12px; color: #8b949e; margin: -6px 0 12px 138px; line-height: 1.6; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    button {
      padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
      border: 1px solid #d6dae0; background: #fff; color: #1f2328; font-family: inherit;
    }
    button.primary { background: #378add; border-color: #378add; color: #fff; font-weight: 500; }
    button:hover { filter: brightness(0.96); }
    .toast { font-size: 13px; color: #1a7f37; opacity: 0; transition: opacity 0.25s; }
    .toast.show { opacity: 1; }
    .toast.bad { color: #b42318; }
    code {
      background: #f1f3f5; padding: 1px 5px; border-radius: 4px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px;
    }
    .note {
      background: #fbfcfd; border-left: 3px solid #b5d4f4;
      padding: 10px 14px; font-size: 12.5px; color: #57606a; line-height: 1.7;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Bili 本地字幕</h1>
  <div class="sub">只对没有官方字幕的视频工作，转写全程在本机完成，音频不出网。</div>

  <div class="card">
    <h2>本地服务</h2>
    <div class="field">
      <label>服务地址</label>
      <input type="text" id="serviceUrl" placeholder="http://127.0.0.1:8765" />
    </div>
    <div class="hint">先双击运行 <code>server\run.bat</code>，首次启动会自动装依赖。</div>
    <div class="actions">
      <button id="btnPing">测试连接</button>
      <span class="toast" id="toastPing"></span>
    </div>
  </div>

  <div class="card">
    <h2>识别参数</h2>
    <div class="field">
      <label>默认模型</label>
      <select id="defaultModel">
        <option value="tiny">tiny — 最快，质量一般</option>
        <option value="base">base — 较快</option>
        <option value="small">small — 推荐，平衡</option>
        <option value="medium">medium — 更准，慢 2–3 倍</option>
        <option value="large-v3">large-v3 — 最准，需要 GPU</option>
      </select>
    </div>
    <div class="field">
      <label>计算设备</label>
      <select id="device">
        <option value="cpu">CPU（int8）</option>
        <option value="cuda">GPU（需要 CUDA 库）</option>
      </select>
    </div>
    <div class="field">
      <label>计算精度</label>
      <select id="computeType">
        <option value="int8">int8 — CPU 推荐</option>
        <option value="float16">float16 — GPU 推荐</option>
        <option value="int8_float16">int8_float16 — GPU 省显存</option>
      </select>
    </div>
    <div class="hint">
      首次使用某个模型会自动下载（small 约 500 MB）。模型缓存在
      <code>%LOCALAPPDATA%\bili-sub</code> 与 HuggingFace 缓存目录。
    </div>
    <div class="note">
      选 GPU 前需要先安装 CUDA 运行库：<br />
      <code>pip install nvidia-cublas-cu12 nvidia-cudnn-cu12</code><br />
      装不上或报 DLL 错误时，把设备改回 CPU 即可，功能不受影响。
    </div>
  </div>

  <div class="card">
    <h2>字幕显示</h2>
    <div class="field">
      <label>字号</label>
      <input type="number" id="fontSize" min="16" max="36" step="1" />
    </div>
    <div class="field">
      <label>启用扩展</label>
      <select id="enabled">
        <option value="true">开启</option>
        <option value="false">关闭</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btnSave">保存设置</button>
    <button id="btnReload">重新读取</button>
    <span class="toast" id="toastSave"></span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
