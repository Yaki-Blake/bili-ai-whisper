<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 288px;
      padding: 14px;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid #eef0f2;
    }
    .row:last-of-type { border-bottom: none; }
    .row span { color: #40474f; }
    input[type="checkbox"] { width: 32px; height: 18px; accent-color: #fb7299; cursor: pointer; }
    select {
      border: 1px solid #d6dae0; border-radius: 6px; padding: 3px 6px;
      font-size: 12px; background: #fff; color: #1f2328; cursor: pointer;
    }
    .status {
      margin: 10px 0 12px; padding: 9px 10px; border-radius: 8px;
      background: #f6f8fa; color: #57606a; font-size: 12px; line-height: 1.5;
    }
    .status.ok { background: #eaf7ee; color: #1a7f37; }
    .status.bad { background: #fdeeee; color: #b42318; }
    .csline {
      margin: -6px 0 12px; font-size: 11.5px; line-height: 1.5; color: #57606a;
    }
    .csline.ok { color: #1a7f37; }
    .csline.bad { color: #b42318; }
    .csline.clickable { cursor: pointer; text-decoration: underline dotted; }
    #csdetail { word-break: break-all; font-size: 11px; white-space: pre-line; }
    .foot { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1; padding: 7px 0; border-radius: 7px; cursor: pointer;
      border: 1px solid #d6dae0; background: #f6f8fa; color: #1f2328; font-size: 12px;
    }
    button.primary { background: #fb7299; border-color: #fb7299; color: #fff; }
    button:hover { filter: brightness(0.96); }
  </style>
</head>
<body>
  <h1>bili-ai-whisper</h1>

  <div id="status" class="status">正在检查本地服务…</div>
  <div id="cstarget" class="csline">目标页：检查中…</div>
  <div id="csinfo" class="csline">页面脚本：检查中…</div>
  <div id="csdetail" class="csline bad" hidden></div>

  <div class="foot" id="skiprow" hidden>
    <button id="forceAsr" class="primary">改用 AI 字幕（覆盖官方字幕）</button>
  </div>

  <div class="row">
    <span>启用字幕</span>
    <input type="checkbox" id="enabled" />
  </div>
  <div class="row">
    <span>字号</span>
    <input type="range" id="fontSize" min="16" max="36" step="1" style="width:120px; accent-color:#378add;" />
  </div>
  <div class="row">
    <span>Whisper 模型</span>
    <select id="asrModel">
      <option value="tiny">tiny</option>
      <option value="base">base</option>
      <option value="small">small</option>
      <option value="medium">medium</option>
    </select>
  </div>

  <div class="foot">
    <button id="openOptions">设置</button>
    <button id="openService" class="primary">检查连接</button>
  </div>

  <div class="foot" id="fixrow" hidden>
    <button id="regrant" class="primary">重新授权 B站 站点权限</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
